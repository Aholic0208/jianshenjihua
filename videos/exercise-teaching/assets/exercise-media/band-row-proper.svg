    </linearGradient>
    <radialGradient id="band-row-proper-glow-gradient" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="rgba(34, 197, 94, 0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <filter id="band-row-proper-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="rgba(0,0,0,0.28)" />
